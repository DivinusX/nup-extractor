name: CI Linux (Build & Test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build, Test & Package (linux-x64)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run xUnit tests
        run: dotnet test tests_native -c Release --verbosity normal

      - name: Publish standalone Linux executable
        run: |
          dotnet publish src_linux -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o dist_linux
          test -x dist_linux/NUP_Extractor

      - uses: actions/upload-artifact@v6
        with:
          name: NUP_Extractor-linux-x64
          path: dist_linux/NUP_Extractor
          retention-days: 14
