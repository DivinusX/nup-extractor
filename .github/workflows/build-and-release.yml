name: Build & Release NUP Extractor

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore NupExtractor.slnx

    - name: Run Automated Test Suite (19 Tests)
      run: dotnet test NupExtractor.slnx -c Release --no-restore --verbosity normal

    - name: Publish Standalone Executable
      run: |
        dotnet publish src_native/NupExtractorApp.csproj `
          -c Release `
          -r win-x64 `
          --self-contained `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -o dist_release

    - name: Package Release Assets
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force release_assets
        Copy-Item dist_release/NupExtractorApp.exe release_assets/NUP_Extractor.exe
        Copy-Item README.md release_assets/
        Copy-Item LICENSE release_assets/
        Compress-Archive -Path release_assets/* -DestinationPath release_assets/NUP_Extractor-windows-x64.zip
        
        # Generate SHA256 checksums
        $hash = Get-FileHash release_assets/NUP_Extractor-windows-x64.zip -Algorithm SHA256
        "$($hash.Hash)  NUP_Extractor-windows-x64.zip" | Out-File -Encoding utf8 release_assets/SHA256SUMS.txt
        Write-Host "Generated SHA-256 Checksum: $($hash.Hash)"

    - name: Determine Release Tag (Auto-Increment)
      if: github.event_name != 'pull_request'
      id: tag_version
      shell: pwsh
      run: |
        git fetch --tags --force
        
        if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
            Write-Host "Triggered by explicit tag push: $tag"
        } else {
            # Find all existing tags matching semantic version vX.Y.Z
            $tags = git tag -l "v*"
            $maxMajor = 1
            $maxMinor = 0
            $maxPatch = 0
            
            foreach ($t in $tags) {
                if ($t -match '^v?(\d+)\.(\d+)\.(\d+)$') {
                    $maj = [int]$Matches[1]
                    $min = [int]$Matches[2]
                    $pat = [int]$Matches[3]
                    
                    if ($maj -gt $maxMajor) {
                        $maxMajor = $maj
                        $maxMinor = $min
                        $maxPatch = $pat
                    } elseif ($maj -eq $maxMajor -and $min -gt $maxMinor) {
                        $maxMinor = $min
                        $maxPatch = $pat
                    } elseif ($maj -eq $maxMajor -and $min -eq $maxMinor -and $pat -gt $maxPatch) {
                        $maxPatch = $pat
                    }
                }
            }
            
            # Increment patch version automatically (v1.0.0 -> v1.0.1, etc.)
            $nextPatch = $maxPatch + 1
            $tag = "v$maxMajor.$maxMinor.$nextPatch"
            Write-Host "Auto-incremented release tag from latest (v$maxMajor.$maxMinor.$maxPatch) to: $tag"
        }
        
        "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NUP_Extractor-Windows-x64
        path: release_assets/NUP_Extractor-windows-x64.zip

    - name: Create GitHub Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: NUP Extractor ${{ env.RELEASE_TAG }}
        files: |
          release_assets/NUP_Extractor-windows-x64.zip
          release_assets/SHA256SUMS.txt
        draft: false
        prerelease: false
        generate_release_notes: true
